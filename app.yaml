# Databricks App start command.
# Uvicorn boots the FastAPI app; static UI is served from src/lakehouse_market/static/.
command:
  - uvicorn
  - lakehouse_market.app:app
  - --host=0.0.0.0
  - --port=8000

env:
  - name: LHM_CATALOG
    value: jdub_demo
  - name: LHM_SCHEMA
    value: lakehouse_market
  - name: DATABRICKS_WAREHOUSE_ID
    # Injected from the `warehouse-default` sql_warehouse binding in resources/app.yml.
    valueFrom: warehouse-default
  - name: LABOR_ENDPOINT
    # In dev-mode targets, DAB prefixes serving endpoints (dev_<user>_lhm-labor-recommender);
    # scripts/setup.sh rewrites this value for dev targets after deploy. For production
    # targets (e.g. `dais`) the canonical name is used as-is.
    value: dev_jonathan_whiteley_lhm-labor-recommender
  - name: FM_ENDPOINT
    value: databricks-claude-sonnet-4-6
  - name: GENIE_SPACE_ID
    # Populated by scripts/setup.sh after notebooks/06_ensure_genie_space.py runs.
    value: "01f15c9315b117008c9d056472ecdf03"
  - name: DEMO_ANCHOR_DATE
    # Synthetic data window ends 2025-10-30; queries use this as "today".
    value: "2025-10-30"
  - name: LHM_QUERY_CACHE_TTL
    # Demo workload: the underlying data only changes on a redeploy, so cache
    # SQL warehouse reads for 24h. After the first visit to any tab, every
    # subsequent navigation on that tab is served from in-process memory.
    value: "86400"
  # /apps launcher: per-workspace URLs for the sibling industry apps. Each
  # Databricks deploy can point at its own internal instance of each app by
  # overriding these. Surfaced via /api/meta/apps to AppsLanding on mount.
  # PLACEHOLDERS: replace each value with the URL of that app in your workspace.
  - name: CONTRACT_RECON_URL
    value: "https://REPLACE-WITH-CONTRACT-RECON-APP-URL"
  - name: COMPUTER_VISION_URL
    value: "https://REPLACE-WITH-COMPUTER-VISION-APP-URL"
  - name: IRREGULAR_OPS_URL
    value: "https://REPLACE-WITH-IRREGULAR-OPS-APP-URL"
  - name: LAKEBASE_INSTANCE
    value: "lakehouse-market-app-db"
  - name: LAKEBASE_DB
    value: "databricks_postgres"
  # LAKEBASE_HOST / LAKEBASE_USER / LAKEBASE_PASSWORD are auto-injected by the
  # `homebase-db` database resource binding in resources/app.yml as
  # PGHOST / PGUSER / PGPASSWORD; src/lakehouse_market/config.py falls back to
  # the PG* names when the LAKEBASE_* values are absent.

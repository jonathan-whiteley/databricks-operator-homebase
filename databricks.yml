# Databricks Asset Bundle (DAB) — root config for Lakehouse Market · Homebase.
# Provisions: the App, Lakebase Postgres instance, the labor Model Serving
# endpoint, and the init job that runs the data-gen + scoring notebooks.

bundle:
  name: lakehouse-market-e2e-DAIS-demo

variables:
  catalog:
    description: Unity Catalog catalog name (must be writable by deployer)
    default: retail_consumer_goods
  schema:
    description: Schema inside the catalog
    default: tth_ops_homebase
  app_name:
    description: Databricks App name
    default: lakehouse-market-homebase
  lakebase_instance:
    description: Lakebase (Postgres on Databricks) instance name
    default: lakehouse-market-app-db
  warehouse_id:
    description: SQL warehouse id the app should read from (resolved by scripts/setup.sh when empty)
    default: ""
  user_email:
    description: Deployer email (run-as for jobs + app)
    default: jonathan.whiteley@databricks.com
  genie_space_id:
    description: Genie space id; populated after first manual Genie space creation
    default: ""
  app_sp_id:
    description: App service principal client id for the CAN_RUN grant on the Genie space (optional; passed at bundle run time).
    default: ""

include:
  - resources/*.yml

# Force-include the built UI even though .gitignore excludes it.
# `make build` writes Vite output to src/lakehouse_market/static/; the App's
# FastAPI mount serves it at /.
sync:
  include:
    - src/lakehouse_market/static/**

targets:
  default:
    mode: development
    workspace:
      profile: DEFAULT
    run_as:
      user_name: ${var.user_email}

  dais:
    mode: production
    workspace:
      profile: dais
      host: https://db-dais-2026.cloud.databricks.com
      root_path: /Workspace/Users/rcg-dais2026@databricks-events.com/.bundle/${bundle.name}/${bundle.target}
    run_as:
      user_name: rcg-dais2026@databricks-events.com
    variables:
      catalog: retail_consumer_goods
      schema: tth_ops_homebase

[project]
name = "lakehouse-market"
version = "0.1.0"
description = "Lakehouse Market · Homebase — store manager's daily operations console on Databricks"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Databricks Field Engineering" }]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "databricks-sdk>=0.36",
  "databricks-sql-connector>=3.4",
  "asyncpg>=0.29",
  "httpx>=0.27",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-mock>=3.14",
  "ruff>=0.7",
  "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lakehouse_market"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

# Databricks App resource.
# The app source code is the entire repo; app.yaml at the repo root tells the
# runtime how to start the server.

resources:
  apps:
    homebase:
      name: ${var.app_name}
      source_code_path: ${workspace.file_path}
      resources:
        - name: warehouse-default
          sql_warehouse:
            id: ${var.warehouse_id}
            permission: CAN_USE
        # NOTE: Lakebase database binding is added after the Lakebase instance
        # is up + the labor model is trained. Uncomment after `make run-init`
        # completes and re-deploy. See README "First-time deploy" for details.
        # - name: homebase-db
        #   database:
        #     instance_name: ${var.lakebase_instance}
        #     database_name: homebase
        #     permission: CAN_CONNECT_AND_CREATE

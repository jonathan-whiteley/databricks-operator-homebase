# Model Serving endpoint — the only custom-served model in the demo.
# The model is registered to Unity Catalog by notebook 02_train_labor_model.py.
resources:
  model_serving_endpoints:
    lhm_labor_recommender:
      name: lhm-labor-recommender
      config:
        served_entities:
          - name: labor_v1
            entity_name: ${var.catalog}.${var.schema}.lhm_labor_recommender
            entity_version: "1"
            workload_size: Small
            scale_to_zero_enabled: true
